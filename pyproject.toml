[project]
name = "pluck"
version = "0.1.0"
description = "product extraction as a decision tree: the page answers first, the model is the last resort"
readme = "README.md"
authors = [
    { name = "benjamin barrera", email = "benbarrera13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "mini-racer>=0.14.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

