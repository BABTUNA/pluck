app = "pluck-extract"
primary_region = "sjc"

[build]

[env]
  PLUCK_EMBED = "0"

[processes]
  app = "uvicorn pipeline.api:app --host 0.0.0.0 --port 8080"
  worker = "python -m pipeline.worker"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
